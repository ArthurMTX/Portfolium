[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require database)
    slow: Slow running tests
    api: API endpoint tests
    service: Service layer tests
    crud: CRUD operation tests
    auth: Authentication/authorization tests
    
# Coverage options (optional)
# Uncomment to enable coverage by default
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# Environment variables for tests.
# ENABLE_EMAIL is forced here because pytest-env overrides inherited shell
# variables (load_dotenv does not): a shell carrying the root .env
# (ENABLE_EMAIL=true) otherwise makes /auth/login demand verified users and
# 401-cascades every auth_headers-based test.
env =
    TESTING=true
    ENVIRONMENT=test
    DATABASE_URL=sqlite:///:memory:
    LOG_FILE_ENABLED=false
    REDIS_ENABLED=false
    ENABLE_BACKGROUND_TASKS=false
    ENABLE_EMAIL=false

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
