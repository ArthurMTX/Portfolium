priority_batches:
  - id: p0-docs-foundation
    title: "Make the docs information architecture match the app"
    includes:
      - "Remove or hide obsolete example layouts."
      - "Add Operations section."
      - "Split User Guide by actual frontend routes."
      - "Merge duplicate pricing and admin email pages."

  - id: p1-operator-and-developer-truth
    title: "Rewrite operator and technical source-of-truth pages"
    includes:
      - "Configuration from api/app/config.py."
      - "Background jobs from api/app/celery_app.py."
      - "Data models from api/app/models and Alembic."
      - "Pricing, currency, and logo docs from current services."

  - id: p2-product-workflows
    title: "Rewrite user-facing workflows"
    includes:
      - "Dashboard overview and widget grid."
      - "Transactions, imports, conversions, pending dividends."
      - "Portfolios, goals, and public sharing."
      - "Assets, asset research, investment notes, and metadata."
      - "Calendar, allocation, notifications, profile/security."

  - id: p3-widgets-and-metrics
    title: "Reconcile widgets and detailed metrics against implementation"
    includes:
      - "Rename stale widget pages to registry IDs."
      - "Add missing widget pages."
      - "Verify metric formulas against backend/frontend builders."

  - id: p4-polish-and-screenshots
    title: "Add current screenshots and improve presentation"
    includes:
      - "Use .github/assets screenshots on key pages."
      - "Replace the gallery with a current, compact visual tour."
      - "Reduce internal-only detail from public-facing pages."
