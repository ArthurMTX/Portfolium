version: 1
updated: "2026-07-05"
purpose: "Documentation content audit for the Portfolium refactor."

status_values:
  current: "Aligned enough with the current codebase."
  partial: "Useful but incomplete or missing important current behavior."
  stale: "Contains outdated paths, architecture, endpoints, or workflows."
  needs_verification: "Likely useful but must be checked against implementation or formulas."
  obsolete: "Should be removed, archived, merged, or rewritten from scratch."
  planned: "Missing page that should be created."

action_values:
  keep: "Keep with routine maintenance."
  revise: "Edit in place."
  rewrite: "Rewrite from the code/product behavior."
  merge: "Merge into another page."
  rename: "Rename to match current implementation names."
  remove_from_nav: "Remove from navigation until rewritten."
  archive: "Keep as historical/internal material outside the primary docs path."
  verify_against_code: "Check formulas, thresholds, routes, or UI against source."
  add: "Create the page."

source_roots:
  frontend_routes: "web/src/app/App.tsx"
  frontend_api: "web/src/api"
  widgets_registry: "web/src/features/dashboard/components/widgets/registry/widgetDefinitions.ts"
  widget_constraints: "web/src/features/dashboard/components/utils/widgetConstraints.ts"
  backend_routes: "api/app/routers"
  backend_services: "api/app/services"
  celery: "api/app/celery_app.py"
  tasks: "api/app/tasks"
  models: "api/app/models"
  settings: "api/app/config.py"
  migrations: "api/alembic/versions"
  compose: "docker-compose.yml"
  compose_dev: "docker-compose.dev.yml"
  screenshots: ".github/assets"

