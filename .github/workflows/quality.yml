name: Quality and Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_SOCKET_TIMEOUT: 1
      REDIS_SOCKET_CONNECT_TIMEOUT: 1
      LOG_FILE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pip-audit
      - run: ruff check app tests
      - run: python -m compileall -q app
      - run: timeout 15m pytest -q
      # PYSEC-2026-1325 affects python-ecdsa ECDSA signing.
      # Portfolium uses HS256 only; ecdsa is a transitive dependency of python-jose.
      - name: Audit Python dependencies
        run: pip-audit --ignore-vuln PYSEC-2026-1325

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: portfolium
          POSTGRES_USER: portfolium
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      # Deterministic CI-only settings; never reuse outside CI.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: portfolium
      POSTGRES_USER: portfolium
      POSTGRES_PASSWORD: ci-only-password
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      ENVIRONMENT: production
      REDIS_ENABLED: "false"
      ENABLE_BACKGROUND_TASKS: "false"
      ENABLE_EMAIL: "false"
      ADMIN_AUTO_CREATE: "false"
      LOG_FILE_ENABLED: "false"
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Validate single migration head
        run: |
          python - <<'EOF'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          assert len(heads) == 1, f"Expected exactly one migration head, got: {heads}"
          print(f"Single migration head OK: {heads[0]}")
          EOF
      - name: Apply all migrations to an empty database
        run: alembic upgrade head
      - name: Detect model changes without migrations
        run: python scripts/check_migration_drift.py
      - name: Verify latest migration downgrades and re-upgrades
        run: |
          alembic downgrade -1
          alembic upgrade head
      - name: Strict-mode cash concurrency test (real PostgreSQL row locks)
        env:
          CASH_PG_TEST_URL: postgresql://portfolium:ci-only-password@127.0.0.1:5432/cash_race_ci
        run: |
          pip install -e ".[dev]"
          PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U portfolium -d portfolium -c "CREATE DATABASE cash_race_ci;"
          pytest tests/test_cash_concurrency.py::TestPostgresRace -q
      - name: Application startup smoke check
        run: |
          python - <<'EOF'
          import asyncio, httpx
          from app.main import app

          async def main():
              transport = httpx.ASGITransport(app=app)
              async with httpx.AsyncClient(transport=transport, base_url="http://smoke") as client:
                  response = await client.get("/health")
                  assert response.status_code == 200, response.text
                  body = response.json()
                  assert body["database"] == "healthy", body
                  print("Startup smoke OK:", body["status"], body["version"])

          asyncio.run(main())
          EOF

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          WEB_PORT=18080 docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet

  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: portfolium-smoke
      WEB_PORT: "18080"
      SMOKE_BASE_URL: http://localhost:18080
      SMOKE_ARTIFACTS: smoke-artifacts/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deterministic frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Configure CI-only stack
        run: cp .env.example .env
      - name: Build and start production-like stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for PostgreSQL, Redis, bootstrap, API, nginx and Celery
        run: |
          timeout 5m sh -c 'until docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T db pg_isready -U portfolium; do sleep 2; done'
          timeout 5m sh -c 'until docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T redis redis-cli ping | grep -q PONG; do sleep 2; done'
          docker compose -f docker-compose.yml -f docker-compose.ci.yml wait bootstrap
          test "$(docker inspect portfolium-ci-bootstrap --format '{{.State.ExitCode}}')" = "0"
          timeout 5m sh -c 'until curl --fail --silent http://localhost:18000/health >/dev/null; do sleep 2; done'
          timeout 5m sh -c 'until curl --fail --silent http://localhost:18080/api/health >/dev/null; do sleep 2; done'
          timeout 5m sh -c 'until docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T celery-worker python -m celery -A app.celery_app inspect ping --timeout=5 | grep -q pong; do sleep 3; done'
      - name: Validate metrics policy, public docs and trailing-slash redirects
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:18080/api/metrics)" = "403"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api curl --fail --silent http://localhost:8000/metrics >/dev/null
          for path in docs scalar openapi.json; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:18080/api/$path")" = "200"
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:18080/api/health)" = "200"
          for proto in http https; do
            location="$(curl --silent --output /dev/null --write-out '%header{location}' -H "X-Forwarded-Proto: $proto" -H 'Host: release.local:8443' http://localhost:18080/api/health/)"
            test "$location" = "/api/health"
          done
      - name: Run release Playwright smoke test
        run: node web/tests/smoke/release-smoke.mjs
      - name: Collect stack diagnostics
        if: always()
        run: |
          mkdir -p smoke-artifacts/logs
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a > smoke-artifacts/docker-compose-ps.txt 2>&1
          for service in web api bootstrap celery-worker celery-beat redis db; do
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color "$service" > "smoke-artifacts/logs/$service.log" 2>&1 || true
          done
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-diagnostics
          path: smoke-artifacts
          if-no-files-found: warn
      - name: Stop and clean production-like stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down --volumes --remove-orphans

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            docs/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r docs/requirements.txt -e ./api
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/api/openapi.json
      - run: python scripts/check_docs_health.py
      - run: python scripts/check_docs_audit.py
      - run: mkdocs build --strict

  filesystem-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
