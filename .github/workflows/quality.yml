name: Quality and Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_SOCKET_TIMEOUT: 1
      REDIS_SOCKET_CONNECT_TIMEOUT: 1
      LOG_FILE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pip-audit
      # The repository has pre-existing style debt; gate syntax/runtime-critical
      # Ruff rules now and expand the baseline in a dedicated cleanup pass.
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: python -m compileall -q app
      - run: timeout 15m pytest -q
      - run: pip-audit

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: portfolium
          POSTGRES_USER: portfolium
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      # Deterministic CI-only settings; never reuse outside CI.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: portfolium
      POSTGRES_USER: portfolium
      POSTGRES_PASSWORD: ci-only-password
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      ENVIRONMENT: production
      REDIS_ENABLED: "false"
      ENABLE_BACKGROUND_TASKS: "false"
      ENABLE_EMAIL: "false"
      ADMIN_AUTO_CREATE: "false"
      LOG_FILE_ENABLED: "false"
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Validate single migration head
        run: |
          python - <<'EOF'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          assert len(heads) == 1, f"Expected exactly one migration head, got: {heads}"
          print(f"Single migration head OK: {heads[0]}")
          EOF
      - name: Apply all migrations to an empty database
        run: alembic upgrade head
      - name: Detect model changes without migrations
        run: python scripts/check_migration_drift.py
      - name: Verify latest migration downgrades and re-upgrades
        run: |
          alembic downgrade -1
          alembic upgrade head
      - name: Application startup smoke check
        run: |
          python - <<'EOF'
          import asyncio, httpx
          from app.main import app

          async def main():
              transport = httpx.ASGITransport(app=app)
              async with httpx.AsyncClient(transport=transport, base_url="http://smoke") as client:
                  response = await client.get("/health")
                  assert response.status_code == 200, response.text
                  body = response.json()
                  assert body["database"] == "healthy", body
                  print("Startup smoke OK:", body["status"], body["version"])

          asyncio.run(main())
          EOF

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            docs/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r docs/requirements.txt -e ./api
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/api/openapi.json
      - run: python scripts/check_docs_health.py
      - run: python scripts/check_docs_audit.py
      - run: mkdocs build --strict

  filesystem-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: docker-compose.yml
          scanners: misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
