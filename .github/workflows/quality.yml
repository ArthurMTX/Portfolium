name: Quality and Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_SOCKET_TIMEOUT: 1
      REDIS_SOCKET_CONNECT_TIMEOUT: 1
      LOG_FILE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pip-audit
      # The repository has pre-existing style debt; gate syntax/runtime-critical
      # Ruff rules now and expand the baseline in a dedicated cleanup pass.
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: python -m compileall -q app
      - run: timeout 15m pytest -q
      - run: pip-audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            docs/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r docs/requirements.txt -e ./api
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/api/openapi.json
      - run: python scripts/check_docs_health.py
      - run: python scripts/check_docs_audit.py
      - run: mkdocs build --strict

  filesystem-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: docker-compose.yml
          scanners: misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
