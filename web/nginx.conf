proxy_cache_path /var/cache/nginx/brandfetch levels=1:2 keys_zone=brandfetch_cache:10m max_size=200m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Disable directory listing globally
    autoindex off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss:;" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite build assets (JS/CSS bundles with hashed names)
    # These files always have extensions like .js, .css, .woff2
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Documentation
    location /docs {
        alias /usr/share/nginx/html/docs;
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # API backend
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Logo resolver - routes through API for smart logo resolution
    # Supports ETF SVG generation and Brandfetch CDN with validation
    # Usage from frontend: <img src="/logos/TICKER" />
    location /logos/ {
        proxy_pass http://api:8000/assets/logo/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Cache responses for 7 days
        proxy_cache brandfetch_cache;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        # Cache durations
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1h;
        
        # Client-side caching
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

}
