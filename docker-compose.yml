x-api-common: &api_common
  restart: unless-stopped
  env_file: [.env]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [portfolium]
  environment:
    POSTGRES_HOST: db
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-${SECRET_KEY}}
    ENVIRONMENT: production
    LOG_FORMAT: json
    LOG_FILE_ENABLED: "false"
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc

services:
  db:
    image: arthurmtx/portfolium-db:${PORTFOLIUM_IMAGE_TAG:-0.4.0}
    container_name: portfolium-db
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolium}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [portfolium]

  redis:
    image: redis:7-alpine
    container_name: portfolium-redis
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${SECRET_KEY}}
    volumes:
      - redis_data:/data
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [portfolium]

  api:
    <<: *api_common
    image: arthurmtx/portfolium-api:${PORTFOLIUM_IMAGE_TAG:-0.4.0}
    container_name: portfolium-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    <<: *api_common
    image: arthurmtx/portfolium-api:${PORTFOLIUM_IMAGE_TAG:-0.4.0}
    container_name: portfolium-celery-worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    command: python -m celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q default,high,low

  celery-beat:
    <<: *api_common
    image: arthurmtx/portfolium-api:${PORTFOLIUM_IMAGE_TAG:-0.4.0}
    container_name: portfolium-celery-beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    command: python -m celery -A app.celery_app beat --loglevel=info

  bootstrap:
    <<: *api_common
    image: arthurmtx/portfolium-api:${PORTFOLIUM_IMAGE_TAG:-0.4.0}
    container_name: portfolium-bootstrap
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.bootstrap

  web:
    image: arthurmtx/portfolium-web:${PORTFOLIUM_IMAGE_TAG:-0.4.0}
    container_name: portfolium-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - api
    networks: [portfolium]

volumes:
  postgres_data:
  redis_data:

networks:
  portfolium:
    name: portfolium
    driver: bridge
