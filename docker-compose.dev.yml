x-api-build: &api_build
  build:
    context: .
    dockerfile: ./api/Dockerfile

x-api-common: &api_common
  <<: *api_build
  restart: unless-stopped
  env_file: [.env]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [portfolium]
  environment:
    POSTGRES_HOST: db
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ENVIRONMENT: development
    LOG_FORMAT: readable
    LOG_FILE_ENABLED: "true"
    LOG_FILE_PATH: /tmp/portfolium/app.log
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
  volumes:
    - ./api:/app
    - ./web/src/locales:/app/locales:ro
    - theme_minilm_cache:/home/portfolium/.cache/portfolium/theme-minilm

services:
  api-test:
    build:
      context: .
      dockerfile: ./api/Dockerfile
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    env_file: [.env]
    environment:
      TESTING: "true"
      DATABASE_URL: "sqlite:///:memory:"
      ADMIN_AUTO_CREATE: "false"
      CELERY_TASK_ALWAYS_EAGER: "false"
      ENABLE_BACKGROUND_TASKS: "false"
      POSTGRES_HOST: db
      REDIS_HOST: redis
    networks: [portfolium]
    volumes:
      - ./api:/app
      - ./web/src/locales:/app/locales:ro
    command: pytest tests/ -v

  db:
    image: postgres:15-alpine
    container_name: portfolium-db
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolium}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [portfolium]

  redis:
    image: redis:7-alpine
    container_name: portfolium-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [portfolium]

  api:
    <<: *api_common
    container_name: portfolium-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./web/public/favicon-96x96.png:/app/static/logo.png:ro
      - theme_minilm_cache:/home/portfolium/.cache/portfolium/theme-minilm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    <<: *api_common
    container_name: portfolium-celery-worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q default,high,low
    ports:
      - "9809:9809"

  celery-beat:
    <<: *api_common
    container_name: portfolium-celery-beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    # -s keeps the schedule shelve out of the bind-mounted source dir,
    # which the non-root container user cannot write to
    command: celery -A app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

  bootstrap:
    <<: *api_common
    container_name: portfolium-bootstrap
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.bootstrap

  flower:
    <<: *api_common
    container_name: portfolium-flower
    command: python -m celery -A app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile
      target: development
    container_name: portfolium-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      DOCKER_ENV: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/public/docs
    networks: [portfolium]

volumes:
  postgres_data:
  redis_data:
  theme_minilm_cache:

networks:
  portfolium:
    driver: bridge
