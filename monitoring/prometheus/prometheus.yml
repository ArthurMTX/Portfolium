global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: portfolium-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: portfolium-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: portfolium-redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: portfolium-celery
    static_configs:
      - targets:
          - celery-exporter:9808

  - job_name: portfolium-celery-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - celery-worker:9809
